pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        # STUDENT-TASK(TD04): proxy to delivery-api:8000 with bounded timeouts,
        # forwarded request metadata and Docker DNS behavior that survives API
        # container recreation. Replace this diagnostic response only after
        # the upstream contract is defined and tested.
        location / {
            return 503;
        }
    }
}
